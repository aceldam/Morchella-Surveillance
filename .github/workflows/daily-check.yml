name: Daily morel check

on:
  schedule:
    # 07:00 Danish time (06:00 UTC) every day March through June; the script exits after 15 June.
    - cron: "0 6 * 3-6 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the score and print the alert without sending a notification
        type: boolean
        default: true
      date:
        description: Pretend today is this date (YYYY-MM-DD), useful for testing outside the season
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Score today's weather and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: >
          node scripts/check.mjs
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ${{ inputs.date != '' && format('--date={0}', inputs.date) || '' }}
